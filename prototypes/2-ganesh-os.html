*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;font-family:'Bricolage Grotesque';background:#0F2A33;color:#13262D}

.term input{background:none;border:0;color:#F2A541;font:inherit;outline:none;width:80%}
.hi{position:fixed;right:40px;bottom:40px;color:#E7EEE9;text-align:right;z-index:3}
.hi h1{font-size:84px;font-weight:800;letter-spacing:-.045em;line-height:.88;margin:0}.hi p{color:#9FB5B2;margin:10px 0 0}
