<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outdoors — Ganesh Karayi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#1a1c1f; --fg:#e3e5e8; --muted:#8d949c; --line:#2b2e33; --card:#212429; --accent:oklch(74% 0.06 235); }
  :root[data-theme="light"] { --bg:oklch(96.5% 0.016 85); --fg:oklch(29% 0.03 245); --muted:oklch(48% 0.028 245);
                              --line:oklch(88% 0.014 85); --card:oklch(93% 0.015 85); --accent:oklch(48% 0.06 245); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:'Work Sans',sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  a:hover { color:var(--accent); }
  .serif { font-family:'Montserrat',sans-serif; font-weight:600; letter-spacing:-0.015em; }
  nav { position:sticky; top:0; z-index:500; display:flex; align-items:center; justify-content:space-between;
        flex-wrap:wrap; gap:16px; padding:18px 40px; background:var(--bg); border-bottom:1px solid var(--line); }
  .navlinks { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .navlinks a { font-size:14px; padding:6px 12px; color:var(--muted); border-bottom:1px solid transparent;
                transition:background 0.25s ease, color 0.25s ease; }
  .navlinks a:hover { background:color-mix(in oklch, var(--accent) 14%, transparent); color:var(--fg); }
  .navlinks a.active { color:var(--accent); border-bottom-color:var(--accent); }
  #themeBtn { cursor:pointer; margin-left:8px; width:30px; height:30px; display:flex; align-items:center;
              justify-content:center; border:1px solid var(--line); border-radius:50%; font-size:13px; color:var(--muted);
              transition:background 0.25s ease, color 0.25s ease; }
  #themeBtn:hover { background:color-mix(in oklch, var(--accent) 14%, transparent); color:var(--fg); }
  nav > a.serif { padding:2px 8px; margin:0 -8px; transition:background 0.25s ease; }
  nav > a.serif:hover { background:color-mix(in oklch, var(--accent) 14%, transparent); color:var(--fg); }
  main { max-width:940px; margin:0 auto; padding:64px 40px 100px; }
  .entry { padding:44px 0; border-top:1px solid var(--line); }
  .route { margin:22px 0 6px; text-align:center; }
  .route svg { display:inline-block; background:var(--card); border:1px solid var(--line); max-width:100%; }
  .elev { margin:0 0 4px; }
  .elev svg { display:block; width:100%; height:auto; }
  .elev { max-width:900px; margin:0 auto 4px; }
  .caption { font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); }
  .stats { display:flex; flex-wrap:wrap; gap:0 40px; margin-top:4px; }
  .stats div { padding:12px 0; }
  .sval { font-size:19px; font-family:'Montserrat',sans-serif; font-weight:600; letter-spacing:-0.015em; }
  .slab { font-family:'Montserrat',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); margin-top:3px; }
  .photos { columns:2; column-gap:10px; margin-top:18px; }
  .photos img { width:100%; height:auto; display:block; background:var(--card); margin:0 0 10px; break-inside:avoid;
                cursor:zoom-in; transition:opacity 0.25s ease; }
  .photos img:hover { opacity:0.82; }
  #lb { position:fixed; inset:0; z-index:900; display:none; align-items:center; justify-content:center;
        padding:5vh 5vw; background:color-mix(in oklch, var(--bg) 72%, transparent);
        backdrop-filter:blur(18px) saturate(0.9); -webkit-backdrop-filter:blur(18px) saturate(0.9);
        opacity:0; transition:opacity 0.28s ease; cursor:zoom-out; }
  #lb.on { display:flex; opacity:1; }
  #lb img { max-width:100%; max-height:90vh; object-fit:contain; display:block;
            box-shadow:0 30px 80px rgba(0,0,0,0.5); transform:scale(0.97);
            transition:transform 0.28s ease; }
  #lb.on img { transform:scale(1); }
  #lbClose { position:absolute; top:22px; right:26px; font-size:26px; line-height:1; color:var(--muted); cursor:pointer; }
  #lbClose:hover { color:var(--fg); }
  footer { text-align:center; padding:30px; font-size:12px; color:var(--muted); border-top:1px solid var(--line); }
  @media (max-width:640px) {
    nav, main { padding-left:22px; padding-right:22px; }
    main { padding-top:44px; }

    .photos { columns:1; }
  }
</style>
</head>
<body>
<nav>
  <a href="index.html" class="serif" style="font-size:19px;">Ganesh Karayi</a>
  <div class="navlinks">
    <a href="index.html#home">Home</a>
    <a href="index.html#experience">Experience</a>
    <a href="index.html#projects">Projects</a>
    <a href="index.html#coursework">Coursework</a>
    <a href="index.html#outdoors" class="active">Outdoors</a>
    <div id="themeBtn" title="Toggle theme">☀</div>
  </div>
</nav>

<main>
  <h1 class="serif" style="font-size:34px; margin:0 0 12px;">Outdoors</h1>
  <p style="font-size:16px; line-height:1.7; font-weight:300; color:var(--muted); max-width:520px; margin:0;">
    Check it out to some of the cool hikes I've been doing recently. If you have any recommendations, I'd love to hear them!
  </p>

  <div id="feed" style="margin-top:52px;"></div>
</main>

<div id="lb"><div id="lbClose">×</div><img alt=""></div>

<footer>© 2026 Ganesh Karayi</footer>

<script>
(function () {
  var root = document.documentElement;
  function apply(dark) {
    if (dark) root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', 'light');
    var b = document.getElementById('themeBtn');
    if (b) b.textContent = dark ? '☀' : '☾';
  }
  var dark = true;
  try { dark = localStorage.getItem('gk-theme') !== 'light'; } catch (e) {}
  apply(dark);
  document.addEventListener('DOMContentLoaded', function () {
    apply(dark);
    document.getElementById('themeBtn').addEventListener('click', function () {
      dark = !dark;
      try { localStorage.setItem('gk-theme', dark ? 'dark' : 'light'); } catch (e) {}
      apply(dark);
    });
  });
})();
</script>
<script src="activities.js"></script>
<script>
(function () {
  var acts = window.ACTIVITIES || [];

  // Lightbox: click any photo to see it full-size over a blurred page.
  var lb = document.getElementById('lb'), lbImg = lb.querySelector('img');
  function open(src, alt) { lbImg.src = src; lbImg.alt = alt || ''; lb.classList.add('on'); document.body.style.overflow = 'hidden'; }
  function close() { lb.classList.remove('on'); document.body.style.overflow = ''; setTimeout(function () { if (!lb.classList.contains('on')) lbImg.src = ''; }, 300); }
  lb.addEventListener('click', close);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t.tagName === 'IMG' && t.closest('.photos')) open(t.src, t.alt);
  });

  // Route trace, projected equirectangular and drawn with a graticule,
  // north arrow and scale bar so the geography reads.
  function ramp(t) {
    // cool low ground → warm high ground
    var c0 = [74, 80, 88], c1 = [147, 182, 207];
    return 'rgb(' + c0.map(function (v, i) { return Math.round(v + (c1[i] - v) * t); }).join(',') + ')';
  }

  function routeSVG(track, eles) {
    var P = 30;
    var lats = track.map(function (t) { return t[0]; });
    var lons = track.map(function (t) { return t[1]; });
    var la0 = Math.min.apply(null, lats), la1 = Math.max.apply(null, lats);
    var lo0 = Math.min.apply(null, lons), lo1 = Math.max.apply(null, lons);
    var k = Math.cos((la0 + la1) / 2 * Math.PI / 180);
    var spanX = (lo1 - lo0) * k || 1e-6, spanY = (la1 - la0) || 1e-6;
    var ar = Math.max(0.32, Math.min(2.2, spanX / spanY));
    var H = 430, W = Math.round((H - 2 * P) * ar) + 2 * P;
    var s = Math.min((W - 2 * P) / spanX, (H - 2 * P) / spanY);
    var ox = (W - spanX * s) / 2, oy = (H - spanY * s) / 2;
    var X = function (lon) { return ox + (lon - lo0) * k * s; };
    var Y = function (lat) { return H - oy - (lat - la0) * s; };

    // Graticule: pick a degree step giving 3-6 lines across the shorter span.
    var steps = [0.002, 0.005, 0.01, 0.02, 0.05, 0.1];
    var target = Math.max(la1 - la0, lo1 - lo0) / 4, gs = steps[0];
    for (var i = 0; i < steps.length; i++) if (steps[i] <= target) gs = steps[i];
    var g = '', lab = '';
    for (var la = Math.ceil(la0 / gs) * gs; la <= la1; la += gs) {
      var y = Y(la).toFixed(1);
      g += '<line x1="0" y1="' + y + '" x2="' + W + '" y2="' + y + '"/>';
      lab += '<text x="5" y="' + (+y - 4).toFixed(1) + '">' + la.toFixed(3) + '°N</text>';
    }
    var lonLabs = [];
    for (var lo = Math.ceil(lo0 / gs) * gs; lo <= lo1; lo += gs) {
      var x = X(lo).toFixed(1);
      g += '<line x1="' + x + '" y1="0" x2="' + x + '" y2="' + H + '"/>';
      lonLabs.push({ x: +x + 4, t: Math.abs(lo).toFixed(3) + '°W' });
    }

    var pts = track.map(function (t) { return [X(t[1]).toFixed(1), Y(t[0]).toFixed(1)]; });
    var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0] + ' ' + p[1]; }).join(' ');
    var a0 = pts[0], aN = pts[pts.length - 1];

    // Each segment tinted by its elevation, so the trace doubles as a relief map.
    var eLo = Math.min.apply(null, eles), eHi = Math.max.apply(null, eles);
    var eRng = (eHi - eLo) || 1, seg = '';
    for (var q = 1; q < pts.length; q++) {
      var t = (((eles[q] + eles[q - 1]) / 2) - eLo) / eRng;
      seg += '<line x1="' + pts[q - 1][0] + '" y1="' + pts[q - 1][1] + '" x2="' + pts[q][0] +
        '" y2="' + pts[q][1] + '" stroke="' + ramp(t) + '"/>';
    }

    // Legend for the elevation ramp.
    var gw = 84, gx = W - 12 - gw, gy = H - 58;
    var stops = '';
    for (var r = 0; r <= 6; r++) stops += '<stop offset="' + (r / 6 * 100) + '%" stop-color="' + ramp(r / 6) + '"/>';
    var legend = '<defs><linearGradient id="ramp' + Math.round(W + H + eHi) + '">' + stops + '</linearGradient></defs>' +
      '<rect x="' + gx + '" y="' + gy + '" width="' + gw + '" height="6" fill="url(#ramp' + Math.round(W + H + eHi) + ')"/>' +
      '<g fill="var(--muted)" font-family="Work Sans, sans-serif" font-size="9.5">' +
        '<text x="' + gx + '" y="' + (gy + 18) + '">' + Math.round(eLo * 3.28084).toLocaleString() + '</text>' +
        '<text x="' + (gx + gw) + '" y="' + (gy + 18) + '" text-anchor="end">' +
          Math.round(eHi * 3.28084).toLocaleString() + ' ft</text></g>';

    // Scale bar: nice round mile figure under a quarter of the frame width.
    var pxPerMile = 1609.34 / (111320 / s);
    var miles = [0.1, 0.25, 0.5, 1, 2, 5], mi = miles[0];
    for (var j = 0; j < miles.length; j++) if (miles[j] * pxPerMile < (W - 2 * P) * 0.4) mi = miles[j];
    var barW = (mi * pxPerMile).toFixed(1), bx = 12, by = H - 26;

    // START label: flip to the left of the dot when it would run past the frame.
    var flip = +a0[0] + 10 + 40 > W;
    var lx = flip ? (+a0[0] - 10).toFixed(1) : (+a0[0] + 10).toFixed(1);
    var lanchor = flip ? 'end' : 'start';
    var ly = Math.max(14, Math.min(H - 8, +a0[1] + 4)).toFixed(1);

    // North arrow goes to whichever top corner the start dot is not in.
    var nx = (+a0[0] > W / 2 && +a0[1] < 80) ? 26 : W - 26;

    // Bottom band is shared with the scale bar; drop any degree label that would land under it.
    var barEnd = bx + +barW + 44;
    lonLabs.forEach(function (L) {
      if (L.x + 44 < barEnd && L.x > bx - 44) return;
      lab += '<text x="' + L.x.toFixed(1) + '" y="' + (H - 6) + '">' + L.t + '</text>';
    });

    return '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">' +
      '<g stroke="var(--fg)" stroke-opacity="0.07" stroke-width="1">' + g + '</g>' +
      '<g fill="var(--muted)" font-family="Work Sans, sans-serif" font-size="9.5" opacity="0.75">' + lab + '</g>' +
      '<path d="' + d + '" fill="none" stroke="var(--accent)" stroke-opacity="0.13" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<g stroke-width="3" stroke-linecap="round">' + seg + '</g>' +
      legend +
      '<circle cx="' + a0[0] + '" cy="' + a0[1] + '" r="5.5" fill="var(--bg)" stroke="var(--fg)" stroke-width="2"/>' +
      '<circle cx="' + aN[0] + '" cy="' + aN[1] + '" r="4" fill="var(--accent)"/>' +
      '<g fill="var(--fg)" font-family="Work Sans, sans-serif" font-size="10" letter-spacing="0.08em">' +
        '<text x="' + lx + '" y="' + ly + '" text-anchor="' + lanchor + '">START</text></g>' +
      '<g transform="translate(' + nx + ',26)" stroke="var(--muted)" fill="var(--muted)">' +
        '<line x1="0" y1="11" x2="0" y2="-8" stroke-width="1.2"/>' +
        '<path d="M0 -13 L4 -5 L-4 -5 Z" stroke="none"/>' +
        '<text x="0" y="24" text-anchor="middle" font-family="Work Sans, sans-serif" font-size="9.5" stroke="none">N</text></g>' +
      '<g stroke="var(--muted)" fill="var(--muted)">' +
        '<line x1="' + bx + '" y1="' + by + '" x2="' + (bx + +barW) + '" y2="' + by + '" stroke-width="1.4"/>' +
        '<line x1="' + bx + '" y1="' + (by - 4) + '" x2="' + bx + '" y2="' + (by + 4) + '" stroke-width="1.4"/>' +
        '<line x1="' + (bx + +barW) + '" y1="' + (by - 4) + '" x2="' + (bx + +barW) + '" y2="' + (by + 4) + '" stroke-width="1.4"/>' +
        '<text x="' + bx + '" y="' + (by + 16) + '" font-family="Work Sans, sans-serif" font-size="9.5" stroke="none">' +
          mi + (mi === 1 ? ' mile' : ' mi') + '</text></g>' +
      '</svg>';
  }

  // Elevation profile against distance travelled, tinted with the same ramp.
  function elevSVG(eles, track) {
    var W = 900, H = 120, PL = 46, PR = 14, PT = 16, PB = 26;
    var lo = Math.min.apply(null, eles), hi = Math.max.apply(null, eles);
    var rng = (hi - lo) || 1;

    // cumulative distance so the x axis is miles, not sample index
    var cum = [0], R = 6371000;
    for (var i = 1; i < track.length; i++) {
      var dLa = (track[i][0] - track[i-1][0]) * Math.PI / 180;
      var dLo = (track[i][1] - track[i-1][1]) * Math.PI / 180;
      var A = Math.sin(dLa/2) * Math.sin(dLa/2) + Math.cos(track[i-1][0] * Math.PI/180) *
        Math.cos(track[i][0] * Math.PI/180) * Math.sin(dLo/2) * Math.sin(dLo/2);
      cum.push(cum[i-1] + 2 * R * Math.asin(Math.sqrt(A)) / 1609.34);
    }
    var total = cum[cum.length - 1] || 1;
    var X = function (i) { return PL + cum[i] / total * (W - PL - PR); };
    var Y = function (v) { return H - PB - (v - lo) / rng * (H - PT - PB); };

    var pts = eles.map(function (v, i) { return [X(i).toFixed(1), Y(v).toFixed(1)]; });
    var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0] + ' ' + p[1]; }).join(' ');

    var stops = '';
    for (var r = 0; r <= 6; r++) stops += '<stop offset="' + (r / 6 * 100) + '%" stop-color="' + ramp(r / 6) + '"/>';
    var gid = 'ev' + Math.round(hi * 100 + eles.length);

    // horizontal elevation gridlines at three levels
    var grid = '', glab = '';
    [0, 0.5, 1].forEach(function (f) {
      var v = lo + rng * f, y = Y(v).toFixed(1);
      grid += '<line x1="' + PL + '" y1="' + y + '" x2="' + (W - PR) + '" y2="' + y + '"/>';
      glab += '<text x="' + (PL - 6) + '" y="' + (+y + 3.5).toFixed(1) + '" text-anchor="end">' +
        Math.round(v * 3.28084).toLocaleString() + '</text>';
    });

    // mile ticks along the bottom
    var ticks = '', stepMi = total > 8 ? 2 : (total > 3 ? 1 : 0.5);
    for (var mi = stepMi; mi < total; mi += stepMi) {
      var xi = PL + mi / total * (W - PL - PR);
      ticks += '<line x1="' + xi.toFixed(1) + '" y1="' + (H - PB) + '" x2="' + xi.toFixed(1) + '" y2="' + (H - PB + 4) + '"/>';
      glab += '<text x="' + xi.toFixed(1) + '" y="' + (H - PB + 16) + '" text-anchor="middle">' + mi + '</text>';
    }
    glab += '<text x="' + (W - PR) + '" y="' + (H - PB + 16) + '" text-anchor="end">' + total.toFixed(1) + ' mi</text>';
    glab += '<text x="' + (PL - 6) + '" y="' + (H - PB + 16) + '" text-anchor="end">ft</text>';

    var pk = eles.indexOf(hi);
    return '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">' +
      '<defs><linearGradient id="' + gid + '" x1="0" y1="1" x2="0" y2="0">' + stops + '</linearGradient></defs>' +
      '<g stroke="var(--fg)" stroke-opacity="0.08" stroke-width="1">' + grid + ticks + '</g>' +
      '<path d="' + d + ' L' + (W - PR) + ' ' + (H - PB) + ' L' + PL + ' ' + (H - PB) + ' Z" fill="url(#' + gid + ')" fill-opacity="0.28"/>' +
      '<path d="' + d + '" fill="none" stroke="var(--accent)" stroke-opacity="0.85" stroke-width="1.8"/>' +
      '<circle cx="' + X(pk).toFixed(1) + '" cy="' + Y(hi).toFixed(1) + '" r="3.2" fill="var(--accent)"/>' +
      '<g fill="var(--muted)" font-family="Work Sans, sans-serif" font-size="9.5">' + glab + '</g>' +
      '</svg>';
  }

  function geoLine(a) {
    var lats = a.track.map(function (t) { return t[0]; });
    var lons = a.track.map(function (t) { return t[1]; });
    var lo = Math.min.apply(null, a.eles), hi = Math.max.apply(null, a.eles);
    var f = function (n) { return n.toFixed(3); };
    return 'GPS track · ' + a.track.length + ' points · ' +
      f(Math.min.apply(null, lats)) + '–' + f(Math.max.apply(null, lats)) + '°N, ' +
      f(Math.abs(Math.max.apply(null, lons))) + '–' + f(Math.abs(Math.min.apply(null, lons))) + '°W · ' +
      Math.round(lo * 3.28084).toLocaleString() + '–' + Math.round(hi * 3.28084).toLocaleString() + ' ft';
  }

  function fmtDur(m) {
    var h = Math.floor(m / 60), mm = m % 60;
    return h ? h + 'h ' + mm + 'm' : mm + 'm';
  }
  function fmtDate(iso) {
    return new Date(iso).toLocaleDateString('en-US',
      { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  }

  // Feed
  var feed = document.getElementById('feed');
  acts.forEach(function (a, i) {
    var el = document.createElement('div');
    el.className = 'entry';
    var stats = [
      [a.miles.toFixed(2) + ' mi', 'distance'],
      [fmtDur(a.mins), 'moving time'],
      [a.gainFt.toLocaleString() + ' ft', 'elevation gain'],
      [a.type, 'activity']
    ];
    el.innerHTML =
      '<div style="font-size:12px; letter-spacing:0.13em; text-transform:uppercase; color:var(--accent); margin-bottom:8px;">' +
        fmtDate(a.start) + '</div>' +
      '<div class="serif" style="font-size:24px; margin-bottom:4px;">' + a.title + '</div>' +
      '<div style="font-size:14px; color:var(--muted);">' + a.place + '</div>' +
      '<div class="route">' + routeSVG(a.track, a.eles) + '</div>' +
      '<div class="elev">' + elevSVG(a.eles, a.track) + '</div>' +
      '<div class="caption">' + geoLine(a) + '</div>' +
      '<div class="stats">' + stats.map(function (s) {
        return '<div><div class="sval">' + s[0] + '</div><div class="slab">' + s[1] + '</div></div>';
      }).join('') + '</div>' +
      (a.photos.length ? '<div class="photos">' + a.photos.map(function (p) {
        return '<img src="' + p + '" alt="' + a.title + '" loading="lazy">';
      }).join('') + '</div>' : '');
    feed.appendChild(el);

  });
})();
</script>
</body>
</html>
